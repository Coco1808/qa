services:
  mysql:
    image: mysql:8.4
    container_name: qa-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: qa_root_123
      MYSQL_DATABASE: qa_feedback
      MYSQL_USER: qa
      MYSQL_PASSWORD: qa_pass_123
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pqa_root_123"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - qa_mysql_data:/var/lib/mysql

volumes:
  qa_mysql_data:
